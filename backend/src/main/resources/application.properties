spring.application.name=backend

# Database connection (local development defaults; override with environment variables)
spring.datasource.url=${UMEED_DB_URL:jdbc:postgresql://localhost:5432/umeed_dev}
spring.datasource.username=${UMEED_DB_USERNAME:umeed_app}
spring.datasource.password=${UMEED_DB_PASSWORD}

# JPA: never let Hibernate change the schema; Flyway will own it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Firebase ID token verification (the project ID is not a secret)
umeed.firebase.project-id=${UMEED_FIREBASE_PROJECT_ID:umeed-2e018}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${umeed.firebase.project-id}
spring.security.oauth2.resourceserver.jwt.audiences=${umeed.firebase.project-id}
