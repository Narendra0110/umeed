spring.application.name=backend

# Database connection (local development defaults; override with environment variables)
spring.datasource.url=${UMEED_DB_URL:jdbc:postgresql://localhost:5432/umeed_dev}
spring.datasource.username=${UMEED_DB_USERNAME:umeed_app}
spring.datasource.password=${UMEED_DB_PASSWORD}

# JPA: never let Hibernate change the schema; Flyway will own it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Firebase ID token verification (the project ID is not a secret)
umeed.firebase.project-id=${UMEED_FIREBASE_PROJECT_ID:umeed-2e018}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${umeed.firebase.project-id}
spring.security.oauth2.resourceserver.jwt.audiences=${umeed.firebase.project-id}

# Push notifications (F02): path to the Firebase service-account key file, kept OUTSIDE the project.
# Empty means notifications are only written to the log. Never commit or share the key.
umeed.notifications.credentials-file=${UMEED_FIREBASE_CREDENTIALS:}

# Actuator (H02): only the health check is reachable over HTTP, and it says only UP or DOWN.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Rate limits (H02), kept in memory per server. Tests switch them off (see pom.xml) except RateLimitTests.
umeed.rate-limit.enabled=true
umeed.rate-limit.writes-per-minute=30
umeed.rate-limit.uploads-per-minute=10
umeed.rate-limit.requests-per-ip-per-minute=300

# Photo uploads: at most 5 MB per photo, 5 photos per request
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
