# Production settings (H02). Used only with SPRING_PROFILES_ACTIVE=prod, on top of application.properties.
# Every secret comes from the server's environment file (/etc/umeed/backend.env, see deploy/backend.env.example).
# A value with no default here must be set, or the backend refuses to start.

# Database: no local defaults in production.
spring.datasource.url=${UMEED_DB_URL}
spring.datasource.username=${UMEED_DB_USERNAME}
spring.datasource.password=${UMEED_DB_PASSWORD}
# A small pool suits one 4 GB server.
spring.datasource.hikari.maximum-pool-size=10

# Flyway may never wipe the production database.
spring.flyway.clean-disabled=true

# Only Nginx on the same server talks to the backend; Nginx handles HTTPS.
server.address=127.0.0.1
server.port=${UMEED_PORT:8080}
# Trust the X-Forwarded-* headers Nginx adds (client address for rate limits, https scheme).
server.forward-headers-strategy=framework

# Finish running requests before stopping, so a redeploy does not cut anyone off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Never show internal details in error answers.
server.error.include-stacktrace=never
server.error.include-message=never

# Notifications must really be sent in production: the key file is required (checked at startup).
umeed.notifications.credentials-file=${UMEED_FIREBASE_CREDENTIALS}

# Photos live on the server's disk (backed up daily, see H03). The folder must exist and be writable.
umeed.storage.local.root=${UMEED_PHOTOS_DIR:/var/lib/umeed/photos}

# Logs go to the system journal (journalctl -u umeed-backend).
logging.level.root=INFO
